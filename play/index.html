<body>
<div class="stage" id="stage" tabindex="0"><img class="room" id="room" alt="The living room"></div>
<div class="play" id="play"></div>
<div class="rotate-hint">↻ Turn your phone on its side for a bigger picture.</div>
<div class="controls">
  <label>Room <select id="roomSel"><option value="c">C: flatter camera</option><option value="b">Stage camera B (steeper, before C)</option><option value="a">Stage camera A</option><option value="old">Old (close camera)</option></select></label>
  <label>Character size <input id="size" type="range" min="0.5" max="1.5" step="0.05" value="1.05"> <output id="sizeOut">1.05</output></label>
  <label>Depth strength <input id="depth" type="range" min="0" max="1" step="0.05" value="1"> <output id="depthOut">1.00</output></label>
  <label>Walk fps <input id="fps" type="range" min="3" max="14" step="1" value="6"> <output id="fpsOut">6</output></label>
  <label><input id="lock" type="checkbox" checked> Feet locked to the floor</label>
  <label><input id="shadows" type="checkbox" checked> Shadows</label>
  <label><input id="fg" type="checkbox" checked> Foreground</label>
  <label>Shoelace <select id="lace"><option value="1">take 1 (a loop)</option><option value="2">take 2 (across the rug)</option><option value="">gone (shoes dug out)</option></select></label>
  <label>Run fps <input id="runFps" type="range" min="6" max="18" step="1" value="11"> <output id="runFpsOut">11</output></label>
  <label>Jump over the dog <select id="jumpMode"><option value="run">when running</option><option value="always">always</option><option value="never">never (go around)</option></select></label>
  <label>Mom sneezes every <input id="sneezeEvery" type="range" min="4" max="40" step="1" value="12"> <output id="sneezeEveryOut">12</output> s</label>
  <span>Mom: <button id="momTalk">Nag</button> <button id="momWave">Shoo</button> <button id="momPill">Claritin</button></span>
  <label>Music <select id="music"><option value="b">B: intro, then loop</option><option value="a">A: the whole start, looped</option><option value="">off</option></select></label>
  <label>Volume <input id="musicVol" type="range" min="0" max="1" step="0.05" value="0.22"> <output id="musicVolOut">0.22</output></label>
  <label>Floor sound <select id="surface"><option>wood</option><option>concrete</option><option>gravel</option><option value="">off</option></select></label>
</div>
<div class="hint">Keys: <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to walk, hold <kbd>Shift</kbd> to run. Mouse or touch: click/tap the floor to walk there, double-click/double-tap to run. He goes around the dog, or jumps him when running.</div>

<script src="manifest.js"></script>
<script>
// Each room's perspective, measured from its picture: the horizon (where the rug's edges meet), and
// pixels per metre at one floor height (from the front door, 2 m tall). Where you can walk; where the
// dog sleeps and Mom stands. `feel` is the character size and depth strength to judge it at, set
// when you pick the room.
// C is room B's floor reprojected from a camera further back (tools/reproject.ts, horizon 280 → -360),
// then cleaned up by the model (sources/room-c.txt); its horizons are measured from the rug's outline.
// Then the sneaker came out of the pile (sources/room-c-pile.txt): the shoes are buried, and all you see
// is the shoelace trailing out (a prop, `laces`: [picture, x, y, width] where its end tucks under the hoodie).
// At depth 1 (the room's own perspective) and size 1.05 it matches B at 0.85 and 0.5 within 2%.
const FG_B = [['fg-left.png', -24, 610, 310], ['fg-right.png', 1170, 748, 390]];
// `couch`: where the kid sits at the start (his feet, in front of the cushions). `momZone`: the floor
// Mom wanders (x0, y0, x1, y1), her end of the room, well away from the dog.
// `door`: the floor in front of the front door, where the dog drags you out.
// `things`: the furniture the story moves (the crate gets taken in Act 2, the bed in Act 3), each drawn in place on
// the room by the model (sources/prop-*.txt) and cut to a real size by tools/cut-prop.ts. Keyed by the hotspot they
// draw (rooms/home.yaml): `at` is the picture's top-left, `w` its width, `z` its depth (the floor y it stands on),
// `foot` a floor footprint to walk round ([cx, cy, rx, ry], like the dog's). Shown while their hotspot is there
// (src/scene/play.ts says which); the art test alone shows them all. `usedBy`: a gesture of Mom's picks it up
// and puts it back (her Claritin: she takes one as she comes in), `from` where she stands to do it; it's off the
// table while it's in her hand.
const THINGS_C = {
  crate: { src: 'prop-crate.png', at: [60, 560], w: 287, z: 770, foot: [200, 752, 132, 24] },
  'dog-bed': { src: 'prop-bed.png', at: [220, 824], w: 450, z: 985, foot: [445, 985, 222, 62] },
  tv: { src: 'prop-tv.png', at: [1214, 340], w: 76, z: 412 },
  claritin: { src: 'prop-claritin.png', at: [1156, 469], w: 13, z: 490, usedBy: 'pill', from: [1254, 652] },
};
const ROOM_C = { things: THINGS_C, door: [120, 662], couch: [612, 642], momZone: [1010, 652, 1420, 780], laces: { 1: ['lace-1.png', 318, 620, 199], 2: ['lace-2.png', 318, 620, 236] }, horizon: -335, ref: [600, 228], walk: [40, 628, 1490, 1005], dog: [770, 806], mom: [1300, 640], start: [497, 896], fg: FG_B, feel: [1.05, 1] };
const ROOMS = {
  c: { ...ROOM_C, src: 'room-c.png' },
  b: { src: 'room-b.png', horizon: 213, ref: [600, 228], walk: [40, 628, 1490, 1005], dog: [770, 770], mom: [1300, 640], start: [420, 860],
       fg: FG_B, feel: [0.85, 0.5] },
  a: { src: 'room-a.png', horizon: 347, ref: [560, 237], walk: [40, 592, 1490, 1005], dog: [790, 745], mom: [1265, 594], start: [420, 860] },
  old: { src: 'room-old.png', horizon: 116, ref: [600, 262], walk: [80, 625, 1230, 960], dog: [790, 792], mom: [1262, 592], start: [380, 880] },
};
const ROOM_W = 1536;
const stage = document.getElementById('stage');
const $ = (id) => document.getElementById(id);
const opts = { size: 1.05, depth: 1, fps: 6, runFps: 11, lock: true };
for (const id of ['size', 'depth', 'fps', 'runFps']) $(id).oninput = (e) => { opts[id] = +e.target.value; $(id + 'Out').textContent = (+e.target.value).toFixed(id.endsWith('ps') ? 0 : 2); };
$('lock').onchange = (e) => (opts.lock = e.target.checked);
$('shadows').onchange = (e) => stage.classList.toggle('noshadows', !e.target.checked);
$('fg').onchange = (e) => stage.classList.toggle('nofg', !e.target.checked);
let room;
function setRoom(key) {
  room = ROOMS[key]; $('room').src = room.src;
  if (room.feel) [['size', room.feel[0]], ['depth', room.feel[1]]].forEach(([id, v]) => { $(id).value = v; $(id).oninput({ target: $(id) }); });
  // Things close to the camera, drawn over everyone.
  for (const el of stage.querySelectorAll('.fg')) el.remove();
  for (const [src, x, y, w] of room.fg ?? []) {
    const img = document.createElement('img'); img.className = 'fg'; img.src = src;
    Object.assign(img.style, { left: (x / ROOM_W) * 100 + '%', top: (y / 1024) * 100 + '%', width: (w / ROOM_W) * 100 + '%' });
    stage.appendChild(img);
  }
  showLace(); showThings(null);
  [kid.x, kid.y] = room.couch ?? room.start;
  kid.couch = room.couch ? { up: -1 } : null;
  if (typeof mom !== 'undefined') Object.assign(mom, { x: room.mom[0], y: room.mom[1], target: null, rest: 0 });
  stage.focus();
}
// The shoelace lies flat on the floor, under everyone.
function showLace() {
  for (const el of stage.querySelectorAll('.prop')) el.remove();
  const lace = room.laces?.[$('lace').value]; if (!lace) return;
  const [src, x, y, w] = lace, img = document.createElement('img'); img.className = 'prop'; img.src = src;
  Object.assign(img.style, { left: (x / ROOM_W) * 100 + '%', top: (y / 1024) * 100 + '%', width: (w / ROOM_W) * 100 + '%' });
  stage.appendChild(img);
}
$('lace').onchange = showLace;
// The room's things: all of them (null), or those whose hotspot ids are listed.
let thingsShown = [], thingsAsked = null;
const thingsHeld = new Set();
const thingShows = (id, th, ids) => !thingsHeld.has(id) && (!ids || ids.includes(id));
function showThings(ids) {
  thingsAsked = ids;
  for (const el of stage.querySelectorAll('.thing')) el.remove();
  thingsShown = Object.entries(room.things ?? {}).filter(([id, th]) => thingShows(id, th, ids)).map(([id, th]) => {
    const img = document.createElement('img'); img.className = 'thing'; img.src = th.src; img.alt = '';
    Object.assign(img.style, { left: (th.at[0] / ROOM_W) * 100 + '%', top: (th.at[1] / 1024) * 100 + '%', width: (th.w / ROOM_W) * 100 + '%', zIndex: th.z });
    stage.appendChild(img);
    return { id, ...th };
  });
}
$('roomSel').onchange = (e) => setRoom(e.target.value);

// Pixels per metre at floor height y: the room's real perspective at depth strength 1, the same
// everywhere at 0 (the middle of the floor's), and in between, a blend.
function pxPerM(y) {
  const K = room.ref[1] / (room.ref[0] - room.horizon);
  const mid = K * ((room.walk[1] + room.walk[3]) / 2 - room.horizon);
  const real = K * (y - room.horizon);
  return opts.size * mid * Math.pow(real / mid, opts.depth);
}

// The dog's frames are anchored at their middle.
for (const f of MANIFEST.sleep.frames) f.ax = f.w / 2;

function actor(name, contacts = 0) {
  const soft = document.createElement('div'); soft.className = 'shadow soft'; stage.appendChild(soft);

  sit() { kid.path = []; [kid.x, kid.y] = room.couch ?? [kid.x, kid.y]; if (room.couch) kid.couch = { up: -1 }; },
  /** Which of the room's things are there (by hotspot id; see THINGS_C). */
  /** The shoelace off the floor (you've followed it into the pile and dug your running shoes out). */
  lace(on) { if (!on && $('lace').value !== '') { $('lace').value = ''; showLace(); } },
  things(ids) { const want = Object.entries(room.things ?? {}).filter(([id, th]) => thingShows(id, th, ids)).map(([id]) => id).join(); if (want !== thingsShown.map((th) => th.id).join()) showThings(ids); },
  /** Mom walks over to the side table and takes a Claritin: the bottle's in her hand, then back on the table. */
  momPill() {
    const [id, th] = Object.entries(room.things ?? {}).find(([, th]) => th.usedBy === 'pill') ?? [];
    const held = (on) => { if (!id) return; if (on) thingsHeld.add(id); else thingsHeld.delete(id); showThings(thingsAsked); };
    return new Promise((resolve) => {
      const take = () => {
        gesture('pill', false); held(true);
        momAct.done = () => { held(false); resolve(); };
      };
      if (!th || Math.hypot(mom.x - th.from[0], mom.y - th.from[1]) < 4) return take();
      Object.assign(mom, { target: th.from, walkT: 0, arrive: take });
    });
  },
  /** Full screen, on a phone or tablet (from a tap: Start). */
  fullScreen,
  /** The dog stirs (an ear, an eye, a roll). */
  dogStirs: () => dogReacts(),
  startAudio,
  /** The frames, which the street's picture borrows (the dog asleep, the kid running and standing). */
  manifest: MANIFEST,
  /** Out of the living room for good: it stops (Mom sneezing out of sight was still heard on the street). */
  leave() { goneFromRoom = true; momSneeze = null; },
  /** A scene's own music ({ src, loopStart } in seconds), crossfaded in over `fadeSec`; null: the menu's pick again. */
  // (The same track again: it plays on, not from the top.)
  music(pick, fadeSec = 2) { if (pick && track && pick.src === track.src && (pick.startAt ?? 0) === (track.startAt ?? 0)) return; track = pick; startAudio(); playMusic(fadeSec); },
  /** The music fades out to nothing (the epilogue), till a scene's music again. */
  musicOut(fadeSec = 2) { track = { src: '', loopStart: 0 }; startAudio(); playMusic(fadeSec); },
  /**
   * A stinger (a ta-da, the storm breaking: music, so the music button mutes it), over the music. `gain` against the
   * music's volume.
   */
  sting(src, gain = 1) {
    startAudio();
    if (!audio || muted || window.gamePaused) return;
    const go = (buf) => {
      const s = audio.createBufferSource(), g = audio.createGain(), vol = +$('musicVol').value;
      s.buffer = buf; g.gain.value = Math.min(1, vol * 2 * gain);
      // (Over the music, which carries on as it was: a playtest found it dipping "for no clear reason".)
      s.connect(g).connect(master); s.start();
    };
    if (musicBufs[src]) return go(musicBufs[src]);
    fetch(src).then((r) => r.arrayBuffer()).then((b) => audio.decodeAudioData(b)).then((buf) => { musicBufs[src] = buf; go(buf); }).catch(() => {});
  },
  /** The stingers fetched ahead, so each lands on its moment. */
  stingsLoad(srcs) {
    if (!audio) return;
    for (const src of srcs) if (!musicBufs[src] && !stingsLoading.has(src) && stingsLoading.add(src)) fetch(src).then((r) => r.arrayBuffer()).then((b) => audio.decodeAudioData(b)).then((buf) => { musicBufs[src] = buf; }).catch(() => {});
  },
};
</script>
